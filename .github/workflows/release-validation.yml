name: Fork release validation
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable Maven tag (must already have frozen Release assets)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fork-release-${{ github.run_id }}
  cancel-in-progress: false
env:
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
defaults:
  run:
    shell: bash
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - name: Load pinned public verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: gycrosskit/.github
          ref: 607ff44db144c68fc6523de38c04aac29e427b68
          path: .ci-shared
          persist-credentials: false
      - name: Check remote-only release routing contracts
        run: python3 Scripts/test-release-contract.py
      - name: Verify frozen archive and all public variants
        run: python3 .ci-shared/templates/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/verify-public.log -- bash Scripts/verify-release.sh
      - name: Save public evidence
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  remote-consumers:
    needs: verify-public
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - name: Load pinned runner helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: gycrosskit/.github
          ref: 607ff44db144c68fc6523de38c04aac29e427b68
          path: .ci-shared
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure verified fork host
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/mmkv-release-gradle" >> "$GITHUB_ENV"
          printf 'networkaddress.cache.ttl=3600\nnetworkaddress.cache.negative.ttl=0\n' > "$RUNNER_TEMP/ci-java.security"
          echo "JAVA_TOOL_OPTIONS=-Djava.security.properties=$RUNNER_TEMP/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000" >> "$GITHUB_ENV"
          bash .ci-shared/templates/ci-pin-fork-host.sh
      - name: Android public dependency consumption
        run: |
          python3 .ci-shared/templates/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/remote-android.log -- bash KMP/gradlew --init-script "$PWD/Scripts/ci-repositories.gradle" -p verification-consumer -PremoteOnly "-PmmkvVersion=$VERSION" compileDebugKotlinAndroid --refresh-dependencies --no-daemon --max-workers=1 --no-parallel --stacktrace
      - name: iOS frameworks and OHOS shared/executable from public coordinates
        run: |
          case "$(uname -m)" in
            arm64) simulator=IosSimulatorArm64 ;;
            x86_64) simulator=IosX64 ;;
            *) echo 'Unsupported simulator architecture' >&2; exit 1 ;;
          esac
          python3 .ci-shared/templates/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/remote-native.log -- bash KMP/gradlew --init-script "$PWD/Scripts/ci-repositories.gradle" -p verification-consumer -PremoteOnly "-PmmkvVersion=$VERSION" linkDebugFrameworkIosArm64 "linkDebugFramework$simulator" compileKotlinIosX64 linkDebugSharedOhosArm64 linkDebugExecutableOhosArm64 --refresh-dependencies --no-daemon --max-workers=1 --no-parallel --stacktrace
      - name: Save remote consumer evidence
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
