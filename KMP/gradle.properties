# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=false

# Kotlin
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.cacheKind.iosArm64=none
kotlin.native.cacheKind.iosSimulatorArm64=none

# Published KMP wrapper coordinates
MMKV_VERSION=2.4.2
VERSION_NAME=2.4.2-ohos-2.2.21-4
GROUP=com.github.gycrosskit.mmkv-ohos
POM_ARTIFACT_ID=mmkv-kmp

# Native iOS cbridge fetch overrides used when building outside this monorepo.
# MMKV_GIT_REPOSITORY=https://github.com/Tencent/MMKV.git
# MMKV_GIT_TAG=v2.4.2
# MMKV_GIT_BRANCH=<branch>
# MMKV_GIT_COMMIT=<commit>

# Publication metadata
POM_DESCRIPTION=MMKV Kotlin Multiplatform wrapper for Android, iOS and OpenHarmony
POM_URL=https://github.com/gycrosskit/mmkv-ohos
POM_LICENCE_NAME=BSD 3-Clause License
POM_LICENCE_URL=https://opensource.org/licenses/BSD-3-Clause
POM_DEVELOPER_ID=gycrosskit
POM_DEVELOPER_NAME=gycrosskit
POM_SCM_URL=https://github.com/gycrosskit/mmkv-ohos
POM_SCM_CONNECTION=scm:git:git://github.com/gycrosskit/mmkv-ohos.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/gycrosskit/mmkv-ohos.git

# Sonatype / Maven Central
RELEASE_REPOSITORY_URL=https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2
SNAPSHOT_REPOSITORY_URL=https://central.sonatype.com/repository/maven-snapshots/
# The aggregate Sonatype publication task automatically transfers the implicit
# OSSRH Staging API repository to Central Portal for manual review.
CENTRAL_PORTAL_NAMESPACE=io.github.gycrosskit
CENTRAL_PORTAL_PUBLISHING_TYPE=user_managed
